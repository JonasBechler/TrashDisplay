; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Rv2 sends the panel-inversion init command (0x21); this display batch doesn't want it
default_envs = esp32-2432S028R

[env]
; pinned like the libraries: 7.1.0 ships Arduino core 2.0.17, the core the pinned
; esp32-smartdisplay commit was validated against
platform = espressif32@7.1.0
framework = arduino
; no OTA on this device; 3 MB app slot leaves room for the umlaut fonts,
; the LittleFS data partition stays available for the pickup cache
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
build_flags = 
	; -Ofast would add -ffast-math to every library
	-O2
	-Wall
	'-D BOARD_NAME="${this.board}"'
	'-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO'
	'-D LV_CONF_PATH=${platformio.include_dir}/lv_conf.h'
	'-D LV_LVGL_H_INCLUDE_SIMPLE'
lib_deps =
	; pinned: newer smartdisplay renamed the display config macros (no longer matches boards/*.json),
	; and lvgl >= 9.3 changed LV_CONF_PATH handling
	https://github.com/rzeldent/esp32-smartdisplay#a49bf444e77554b38abc47936c236d1230e57a73
	lvgl/lvgl@9.2.2
	bblanchon/ArduinoJson@^7.3.1

; only the board this firmware is laid out for (320x240, CDS sensor, XPT2046)
[env:esp32-2432S028R]
board = esp32-2432S028R

[env:esp32-2432S028Rv2]
board = esp32-2432S028Rv2

[env:esp32-2432S028Rv3]
board = esp32-2432S028Rv3
